server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: travel-backend
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/travelback?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: travel-app-jwt-secret-key-change-in-production-min-256-bits-long!!
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
  weather:
    api-key: ""
    base-url: https://api.openweathermap.org/data/2.5
  assistant:
    api-key: ""
    base-url: https://api.openai.com/v1
  toxicity:
    threshold: 0.7
  grok:
    api-key: ""
    base-url: https://api.x.ai/v1
    model: grok-4.3

logging:
  level:
    com.travelapp: INFO
    org.springframework.security: WARN
