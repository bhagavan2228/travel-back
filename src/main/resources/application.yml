server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: travel-backend

  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mysql://localhost:3306/travelback?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:travel-app-jwt-secret-key-change-in-production-min-256-bits-long!!}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174

  weather:
    api-key: ${WEATHER_API_KEY:}
    base-url: https://api.openweathermap.org/data/2.5

  assistant:
    api-key: ${ASSISTANT_API_KEY:}
    base-url: https://api.openai.com/v1

  toxicity:
    threshold: 0.7

  grok:
    api-key: ${GROK_API_KEY:}
    base-url: https://api.x.ai/v1
    model: grok-4.3

  news:
    api-key: ${NEWS_API_KEY:}
    base-url: https://newsapi.org/v2

  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta/models

  google:
    places-api-key: ${GOOGLE_PLACES_API_KEY:}

  aviationstack:
    api-key: ${AVIATIONSTACK_API_KEY:}
    base-url: https://api.aviationstack.com/v1

  railkit:
    proxy-url: ${RAILKIT_PROXY_URL:}

  duffel:
    api-key: ${DUFFEL_API_KEY:default-key}
    cars-api-key: ${DUFFEL_CARS_API_KEY:default-key}
    base-url: https://api.duffel.com

  hotelbeds:
    api-key: ${HOTELBEDS_API_KEY:default-key}
    api-secret: ${HOTELBEDS_API_SECRET:default-secret}
    base-url: https://api.test.hotelbeds.com/hotel-api/1.0

  perspective:
    api-key: ${PERSPECTIVE_API_KEY:}

logging:
  level:
    com.travelapp: INFO
    org.springframework.security: WARN
