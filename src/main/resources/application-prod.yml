# Production profile for Render / Cloud deployments
# Activate with: SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://mysql-209cf3d2-bhagavan282005-ff14.e.aivencloud.com:27123/defaultdb?sslMode=REQUIRED}
    username: ${DATASOURCE_USERNAME:avnadmin}
    password: ${DATASOURCE_PASSWORD:}
    driver-class-name: ${DATASOURCE_DRIVER:}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

server:
